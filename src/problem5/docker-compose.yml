services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: problem5
      POSTGRES_PASSWORD: problem5
      POSTGRES_DB: problem5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U problem5 -d problem5"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
